[workspace]
resolver = "2"
members = ["crates/*", "kurin"]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/weironz/kurin"

[workspace.dependencies]
kurin-config = { path = "crates/kurin-config" }
kurin-core = { path = "crates/kurin-core" }
kurin-ssh = { path = "crates/kurin-ssh" }
kurin-artifact = { path = "crates/kurin-artifact" }
kurin-kube = { path = "crates/kurin-kube" }
kurin-components = { path = "crates/kurin-components" }
kurin-ops = { path = "crates/kurin-ops" }
kurin-server = { path = "crates/kurin-server" }

axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
minijinja = "2"
rust-embed = "8"
mime_guess = "2"
# TypeScript bindings for the server DTOs (WP-55). `serde-json-impl` maps
# `serde_json::Value` to the generated `JsonValue` union.
ts-rs = { version = "11.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
async-trait = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "fs",
    "io-util",
    "signal",
] }
clap = { version = "4", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
# Server store (WP-51): bundled SQLite keeps the binary self-contained and
# cross-compiles for musl/zig (UI §6.7 / architecture §6.2).
rusqlite = { version = "0.37", features = ["bundled"] }
russh = "0.64.1"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
backon = "1.6.0"
tempfile = "3.27.0"
rcgen = "0.14"
base64 = "0.22"
bcrypt = "0.17"
toml = "0.8"
toml_edit = "0.22"
ipnet = { version = "2", features = ["serde"] }
secrecy = "0.10"
insta = { version = "1", features = ["toml"] }
schemars = { version = "1", features = ["derive", "semver1"] }
jsonschema = { version = "0.60", default-features = false }
time = "0.3"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tokio-util = { version = "0.7", features = ["rt"] }
oci-spec = { version = "0.9", default-features = false, features = ["image"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
