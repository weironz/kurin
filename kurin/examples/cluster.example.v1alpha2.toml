# kurin cluster configuration (schema v1alpha2)
# TOML is the primary format; .yaml/.yml with identical structure also works.
# v1alpha1 files still load unchanged; `kurin config migrate -f old.toml`
# rewrites one as v1alpha2 while preserving comments.
version = "v1alpha2"
name = "prod"

[kubernetes]
version = "1.33.1"
distribution = "kubeadm"        # "kubeadm" (formerly "k8s") | "k3s"

[runtime]
kind = "containerd"             # "containerd" | "crio" (kubeadm track only)

[network]
pod-cidr = "10.233.64.0/18"
service-cidr = "10.233.0.0/18"
dns-domain = "cluster.local"

[network.cni]
kind = "calico"

[ssh]
user = "root"
port = 22

[ssh.auth]
method = "private_key"
key-path = "/root/.ssh/id_ed25519"

# Required when >1 control-plane node. Must not collide with node addresses.
[ha]
vip = "192.168.10.100"

[nodes.master01]
address = "192.168.10.11"
role = "control-plane"

[nodes.master02]
address = "192.168.10.12"
role = "control-plane"

[nodes.master03]
address = "192.168.10.13"
role = "control-plane"

[nodes.worker01]
address = "192.168.10.21"
role = "worker"
labels = { "node-role.kurin.io/pool" = "general" }

# ── addons（声明式；未列出的内置 addon 不安装） ──────────────────
# [addons.metrics-server]
# enabled = true

# [addons.local-path]             # 取代 v1alpha1 的 [storage] kind = "local-path"
