[package]
name = "kurin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Declarative Kubernetes cluster installer"

[[bin]]
name = "kurin"
path = "src/main.rs"

[dependencies]
kurin-config = { path = "../kurin-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
petgraph = "0.8"
minijinja = "2"
rust-embed = "8"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
russh = "0.64.1"
backon = "1.6.0"
futures = "0.3.34"
tempfile = "3.27.0"
