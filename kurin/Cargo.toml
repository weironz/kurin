[package]
name = "kurin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Declarative Kubernetes cluster installer"

[[bin]]
name = "kurin"
path = "src/main.rs"

[features]
default = []
ui = ["dep:kurin-server", "kurin-server/embed-ui"]

[dependencies]
kurin-config.workspace = true
kurin-core.workspace = true
kurin-ssh.workspace = true
kurin-artifact.workspace = true
kurin-components.workspace = true
kurin-ops.workspace = true
kurin-server = { workspace = true, optional = true }
serde_json.workspace = true
serde_yml.workspace = true
toml.workspace = true
miette.workspace = true
tokio.workspace = true
clap.workspace = true
toml_edit.workspace = true
rpassword.workspace = true
ssh-key.workspace = true
rand.workspace = true
semver.workspace = true
tracing.workspace = true
tempfile.workspace = true
oci-spec = { version = "0.9", default-features = false, features = ["image"] }

[dev-dependencies]
async-trait.workspace = true
kurin-kube.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
insta = { version = "1", features = ["yaml", "json"] }
regex = "1"
