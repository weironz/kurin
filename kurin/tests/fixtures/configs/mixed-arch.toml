# WP-04 mixed-architecture fixture: amd64 control plane (declared) +
# arm64 worker (declared). `arch` is the `--dry-run` fallback; discovery
# overrides it on real runs.
version = "v1alpha1"
name = "mixedarch"

[kubernetes]
version = "1.33.1"

[network]
pod-cidr = "10.233.64.0/18"
service-cidr = "10.233.0.0/18"

[network.cni]
kind = "calico"

[ssh]
user = "root"
port = 22

[ssh.auth]
method = "private_key"
key-path = "/root/.ssh/id_ed25519"

[nodes.cp1]
address = "192.168.10.11"
role = "control-plane"
arch = "amd64"

[nodes.w1]
address = "192.168.10.21"
role = "worker"
arch = "arm64"
