# WP-36 fixture: an operator-managed external registry. kurin installs
# nothing; it writes runtime mirrors and pushes package payloads.
version = "v1alpha2"
name = "registry-external"

[kubernetes]
version = "1.33.1"

[network]
pod-cidr = "10.233.64.0/18"
service-cidr = "10.233.0.0/18"
dns-domain = "cluster.local"

[network.cni]
kind = "flannel"

[ssh]
user = "root"
port = 22

[ssh.auth]
method = "private_key"
key-path = "/root/.ssh/id_ed25519"

[registry]
kind = "external"
address = "https://registry.example.com:5000"
namespace = "kurin"

[nodes.master01]
address = "192.168.10.11"
role = "control-plane"

[nodes.worker01]
address = "192.168.10.21"
role = "worker"