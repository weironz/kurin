# WP-00 baseline fixture: config-declared node labels, converged through the
# API from the first control plane (kubeadm v1beta4 ignores
# nodeRegistration.labels).
version = "v1alpha1"
name = "labels"

[kubernetes]
version = "1.33.1"

[network]
pod-cidr = "10.233.64.0/18"
service-cidr = "10.233.0.0/18"
dns-domain = "cluster.local"

[network.cni]
kind = "calico"

[ssh]
user = "root"
port = 22

[ssh.auth]
method = "private_key"
key-path = "/root/.ssh/id_ed25519"

[nodes.master01]
address = "192.168.10.11"
role = "control-plane"
labels = { "node-role.kurin.io/control" = "true" }

[nodes.worker01]
address = "192.168.10.21"
role = "worker"
labels = { "node-role.kurin.io/pool" = "general", "topology.kubernetes.io/zone" = "rack-a" }
