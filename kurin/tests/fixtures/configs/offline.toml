# WP-00 baseline fixture: air-gapped install from a prebuilt bundle. The
# offline-dir placeholder is replaced with an absolute path to
# tests/fixtures/offline-bundle at load time (see tests/plan_snapshots.rs);
# kurin_config::load itself only ever sees the injected absolute path.
version = "v1alpha1"
name = "offline"

[kubernetes]
version = "1.33.1"

[network]
pod-cidr = "10.233.64.0/18"
service-cidr = "10.233.0.0/18"
dns-domain = "cluster.local"

[network.cni]
kind = "calico"

[ssh]
user = "root"
port = 22

[ssh.auth]
method = "private_key"
key-path = "/root/.ssh/id_ed25519"

[artifacts]
offline-dir = "@OFFLINE_DIR@"

[nodes.master01]
address = "192.168.10.11"
role = "control-plane"

[nodes.worker01]
address = "192.168.10.21"
role = "worker"
