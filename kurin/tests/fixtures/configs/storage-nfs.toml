# WP-00 baseline fixture: dynamic storage — nfs-subdir-external-provisioner
# against an external NFS server.
version = "v1alpha1"
name = "storage-nfs"

[kubernetes]
version = "1.33.1"

[network]
pod-cidr = "10.233.64.0/18"
service-cidr = "10.233.0.0/18"
dns-domain = "cluster.local"

[network.cni]
kind = "calico"

[ssh]
user = "root"
port = 22

[ssh.auth]
method = "private_key"
key-path = "/root/.ssh/id_ed25519"

[storage]
kind = "nfs"
server = "192.168.10.50"
path = "/export/kurin"

[nodes.master01]
address = "192.168.10.11"
role = "control-plane"

[nodes.worker01]
address = "192.168.10.21"
role = "worker"
