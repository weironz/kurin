[package]
name = "kurin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kurin engine: tasks, plan data, DAG executor and run state"

[features]
# Derive `ts-rs` bindings for the event types the web API serializes
# (WP-55). Off by default so the CLI build stays free of the dependency.
ts = ["dep:ts-rs"]

[dependencies]
ts-rs = { workspace = true, optional = true }
kurin-config.workspace = true
serde.workspace = true
serde_json.workspace = true
miette.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tempfile.workspace = true
sha2.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true