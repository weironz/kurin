[package]
name = "kurin-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kurin artifact manifest, cache and offline bundle handling"

[dependencies]
kurin-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
semver.workspace = true
sha2.workspace = true
tokio.workspace = true
time = { workspace = true, features = ["formatting"] }
tempfile.workspace = true
oci-client = { version = "0.16", default-features = false, features = ["rustls-tls"] }
http = "1"
base64 = "0.22"
futures-util = "0.3"
tokio-util = { workspace = true, features = ["io"] }
oci-spec = { version = "0.9", default-features = false, features = ["image"] }
tar = "0.4"
zstd = "0.13"
# cosign simple-signing verification (04 §6, WP-39). Pure Rust and
# already in the graph via russh/ssh-key, so no new crates to
# cross-compile. `ecdsa` (verify + sign for tests), `pem`
# (SubjectPublicKeyInfo keys) and `alloc` (SEC1 point export) are the
# only features needed.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "alloc"] }

[dev-dependencies]
tempfile.workspace = true
bcrypt.workspace = true
