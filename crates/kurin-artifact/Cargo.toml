[package]
name = "kurin-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kurin artifact manifest, cache and offline bundle handling"

[dependencies]
kurin-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
semver.workspace = true
sha2.workspace = true
tokio.workspace = true
time = { workspace = true, features = ["formatting"] }
tempfile.workspace = true
oci-client = { version = "0.16", default-features = false, features = ["rustls-tls"] }
http = "1"
base64 = "0.22"
futures-util = "0.3"
tokio-util = { workspace = true, features = ["io"] }
oci-spec = { version = "0.9", default-features = false, features = ["image"] }
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
tempfile.workspace = true
bcrypt.workspace = true
