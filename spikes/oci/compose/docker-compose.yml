services:
  log:
    image: goharbor/harbor-log:v2.13.0
    container_name: kurin-spike-harbor-log
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - ./harbor/data/logs:/var/log/docker/:z
      - type: bind
        source: ./harbor/common/config/log/logrotate.conf
        target: /etc/logrotate.d/logrotate.conf
      - type: bind
        source: ./harbor/common/config/log/rsyslog_docker.conf
        target: /etc/rsyslog.d/rsyslog_docker.conf
    ports:
      - 127.0.0.1:15140:10514
    networks:
      - harbor
  registry:
    image: goharbor/registry-photon:v2.13.0
    container_name: kurin-spike-registry
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./harbor/data/registry:/storage:z
      - ./harbor/common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./harbor/data/secret/registry/root.crt
        target: /etc/registry/root.crt
      - type: bind
        source: ./harbor/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "registry"
  registryctl:
    image: goharbor/harbor-registryctl:v2.13.0
    container_name: kurin-spike-registryctl
    env_file:
      - ./harbor/common/config/registryctl/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./harbor/data/registry:/storage:z
      - ./harbor/common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./harbor/common/config/registryctl/config.yml
        target: /etc/registryctl/config.yml
      - type: bind
        source: ./harbor/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "registryctl"
  postgresql:
    image: goharbor/harbor-db:v2.13.0
    container_name: kurin-spike-harbor-db
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - ./harbor/data/database:/var/lib/postgresql/data:z
    networks:
      harbor:
    env_file:
      - ./harbor/common/config/db/env
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "postgresql"
    shm_size: '1gb'
  core:
    image: goharbor/harbor-core:v2.13.0
    container_name: kurin-spike-harbor-core
    env_file:
      - ./harbor/common/config/core/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - ./harbor/data/ca_download/:/etc/core/ca/:z
      - ./harbor/data/:/data/:z
      - ./harbor/common/config/core/certificates/:/etc/core/certificates/:z
      - type: bind
        source: ./harbor/common/config/core/app.conf
        target: /etc/core/app.conf
      - type: bind
        source: ./harbor/data/secret/core/private_key.pem
        target: /etc/core/private_key.pem
      - type: bind
        source: ./harbor/data/secret/keys/secretkey
        target: /etc/core/key
      - type: bind
        source: ./harbor/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      harbor:
    depends_on:
      - log
      - registry
      - redis
      - postgresql
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "core"
  portal:
    image: goharbor/harbor-portal:v2.13.0
    container_name: kurin-spike-harbor-portal
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - type: bind
        source: ./harbor/common/config/portal/nginx.conf
        target: /etc/nginx/nginx.conf
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "portal"

  jobservice:
    image: goharbor/harbor-jobservice:v2.13.0
    container_name: kurin-spike-harbor-jobservice
    env_file:
      - ./harbor/common/config/jobservice/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./harbor/data/job_logs:/var/log/jobs:z
      - type: bind
        source: ./harbor/common/config/jobservice/config.yml
        target: /etc/jobservice/config.yml
      - type: bind
        source: ./harbor/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      - core
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "jobservice"
  redis:
    image: goharbor/redis-photon:v2.13.0
    container_name: kurin-spike-redis
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./harbor/data/redis:/var/lib/redis
    networks:
      harbor:
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "redis"
  proxy:
    image: goharbor/nginx-photon:v2.13.0
    container_name: kurin-spike-nginx
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./harbor/common/config/nginx:/etc/nginx:z
      - type: bind
        source: ./harbor/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    ports:
      - 15080:8080
    depends_on:
      - registry
      - core
      - portal
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:15140"
        tag: "proxy"
  zot:
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    container_name: kurin-spike-zot
    restart: unless-stopped
    command: ["serve", "/etc/zot/config.json"]
    volumes:
      - ./zot-config.json:/etc/zot/config.json:ro
      - ./data/zot:/var/lib/registry
    ports:
      - "15000:15000"
    networks:
      - harbor
  distribution:
    image: registry:3
    container_name: kurin-spike-distribution
    restart: unless-stopped
    environment:
      REGISTRY_CONFIGURATION_PATH: /etc/distribution/config.yml
    volumes:
      - ./distribution-config.yml:/etc/distribution/config.yml:ro
      - ./data/distribution:/var/lib/registry
    ports:
      - "15001:15001"
    networks:
      - harbor
networks:
  harbor:
    name: kurin-spike-harbor
    external: false
