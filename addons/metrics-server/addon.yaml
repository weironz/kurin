apiVersion: addons.kurin.dev/v1alpha1
kind: Addon
metadata:
  name: metrics-server
  version: 0.9.0
  title: Metrics Server
  description: 资源指标 API（metrics.k8s.io），kubectl top 与 HPA 依赖它
  category: monitoring
spec:
  compat:
    kubernetes: ">=1.30.0"
    distributions: [kubeadm, k3s]
    arch: [amd64, arm64]
  requires: []
  conflicts: []
  provides: [metrics-api]
  namespace: kube-system
  install:
    helm:
      chart: https://github.com/kubernetes-sigs/metrics-server/releases/download/metrics-server-helm-chart-3.14.0/metrics-server-3.14.0.tgz
      release: metrics-server
      values: values.yaml.j2
  images:
    - registry.k8s.io/metrics-server/metrics-server:v0.9.0@sha256:d9862115e7c7881280d3d75ca26bda8ffc0fc213315979575bf23ce9826205c0
    - k8s.m.daocloud.io/metrics-server/metrics-server:v0.9.0@sha256:d9862115e7c7881280d3d75ca26bda8ffc0fc213315979575bf23ce9826205c0
  values-schema: values.schema.json
  defaults:
    replicas: 1
  readiness:
    - kind: Deployment
      name: metrics-server
  timeout: 5m
  hooks:
    post-install:
      - wait:
          kind: APIService
          name: v1beta1.metrics.k8s.io
          condition: Available
  uninstall:
    keep: []
