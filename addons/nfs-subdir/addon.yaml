apiVersion: addons.kurin.dev/v1alpha1
kind: Addon
metadata:
  name: nfs-subdir
  version: 4.0.2
  title: NFS subdir external provisioner
  description: 对接外部 NFS 服务器的动态存储（StorageClass kurin-nfs）
  category: storage
spec:
  compat:
    kubernetes: ">=1.30.0"
    distributions: [kubeadm, k3s]
    arch: [amd64, arm64]
  requires: []
  conflicts: [local-path]
  provides: [default-storage-class]
  namespace: default
  install:
    manifests:
      - manifests/*.yaml.j2
  images:
    - registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2@sha256:63d5e04551ec8b5aae83b6f35938ca5ddc50a88d85492d9731810c31591fa4c9
    - k8s.m.daocloud.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2@sha256:63d5e04551ec8b5aae83b6f35938ca5ddc50a88d85492d9731810c31591fa4c9
  values-schema: values.schema.json
  defaults:
    default-class: false
  readiness:
    - kind: Deployment
      name: nfs-subdir-external-provisioner
  timeout: 3m
  hooks:
    post-install: []
  uninstall:
    keep: []
