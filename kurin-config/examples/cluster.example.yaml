# kurin cluster configuration (schema v1alpha1)
# YAML equivalent of kurin/examples/cluster.example.toml; both load to the
# identical internal Cluster model (see tests/format.rs).
version: v1alpha1
name: prod

kubernetes:
  version: "1.33.1"

network:
  pod-cidr: 10.233.64.0/18
  service-cidr: 10.233.0.0/18
  dns-domain: cluster.local
  cni:
    kind: calico

ssh:
  user: root
  port: 22
  auth:
    method: private_key
    key-path: /root/.ssh/id_ed25519

# Required when >1 control-plane node. Must not collide with node addresses.
ha:
  vip: 192.168.10.100

nodes:
  master01:
    address: 192.168.10.11
    role: control-plane
  master02:
    address: 192.168.10.12
    role: control-plane
  master03:
    address: 192.168.10.13
    role: control-plane
  worker01:
    address: 192.168.10.21
    role: worker
    labels:
      node-role.kurin.io/pool: general
