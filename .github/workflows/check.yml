name: check

# Fast Rust checks on GitHub-hosted runners. E2E stays manual/local; the
# self-hosted runner is only needed for tag releases and package builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: web build
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p kurin --features ui -- -D warnings
          cargo test --workspace
